<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Study Vibe | From Confusion to Confidence</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .homepage {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
      text-align: center;
    }

    .brand {
      font-size: 34px;
      font-weight: 800;
      color: #1765b5;
      letter-spacing: -1px;
      margin-bottom: 6px;
    }

    .tagline {
      color: #777777;
      font-size: 13px;
      margin-bottom: 25px;
    }

    .robot {
      width: min(75vw, 340px);
      height: auto;
      object-fit: contain;
      display: block;
      margin: 0 auto 30px;
      border: none;
      outline: none;
      box-shadow: none;
      background: transparent;
    }

    .buttons {
      width: 100%;
      max-width: 300px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 15px 20px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
      transition: 0.2s ease;
    }

    .start-btn {
      background: #1765b5;
      color: #ffffff;
      border: 2px solid #1765b5;
    }

    .login-btn {
      background: #ffffff;
      color: #1765b5;
      border: 2px solid #1765b5;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .start-btn:hover {
      background: #105397;
    }

    .login-btn:hover {
      background: #f2f7fc;
    }

    .footer {
      margin-top: 35px;
      color: #999999;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <main class="homepage">

    <div class="brand">Study Vibe</div>

    <p class="tagline">
      From Confusion to Confidence
    </p>

    <img
      class="robot"
      src="images/robot1.png"
      alt="Study Vibe AI Robot"
    >

    <div class="buttons">

      <a class="btn start-btn" href="navigation.html">
        Start Learning
      </a>

      <a class="btn login-btn" href="login.html">
        Login
      </a>

    </div>

    <footer class="footer">
      Study Vibe by Addrectionate
    </footer>

  </main>

</body>
</html>
