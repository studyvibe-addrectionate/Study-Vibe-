<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formula Book | Study Vibe</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f3f5fb;
    color: #20243a;
    min-height: 100vh;
}

header {
    background: #20243a;
    color: white;
    padding: 17px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
}

header h2 { font-size: 21px; }

header a {
    color: white;
    text-decoration: none;
    font-size: 14px;
}

.container {
    width: 92%;
    max-width: 950px;
    margin: 30px auto;
}

.hero {
    text-align: center;
    margin-bottom: 25px;
}

.hero h1 {
    color: #263b80;
    font-size: 30px;
    margin-bottom: 8px;
}

.hero p {
    color: #777;
    font-size: 14px;
}

.search-panel {
    background: white;
    padding: 18px;
    border-radius: 14px;
    box-shadow: 0 5px 20px rgba(0,0,0,.05);
    margin-bottom: 20px;
}

.search-panel input {
    width: 100%;
    padding: 14px;
    border: 1px solid #dce0eb;
    border-radius: 9px;
    font-size: 15px;
    margin-bottom: 14px;
}

.search-panel input:focus {
    outline: none;
    border-color: #5268d9;
}

.filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.filters button {
    background: #edf0ff;
    color: #354aab;
    padding: 9px 13px;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    font-weight: bold;
    font-size: 13px;
}

.filters button.active {
    background: #5268d9;
    color: white;
}

.section-title {
    color: #263b80;
    font-size: 20px;
    margin: 25px 0 15px;
}

.formula-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.formula-card {
    background: white;
    border-radius: 13px;
    padding: 18px;
    box-shadow: 0 4px 15px rgba(0,0,0,.04);
    border-left: 4px solid #5268d9;
}

.formula-card h3 {
    font-size: 16px;
    color: #263b80;
    margin-bottom: 12px;
}

.formula {
    background: #f3f5ff;
    color: #263b80;
    padding: 14px;
    border-radius: 8px;
    font-size: 18px;
    font-weight: bold;
    line-height: 1.6;
    overflow-wrap: anywhere;
    margin-bottom: 10px;
}

.description {
    color: #666;
    font-size: 13px;
    line-height: 1.6;
    margin-bottom: 12px;
}

.copy-btn {
    background: #5268d9;
    color: white;
    padding: 9px 13px;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    font-size: 12px;
}

.copy-btn:hover {
    background: #394db5;
}

.empty {
    background: white;
    padding: 25px;
    text-align: center;
    color: #777;
    border-radius: 12px;
    display: none;
}

footer {
    text-align: center;
    color: #888;
    font-size: 12px;
    padding: 25px 10px;
}

@media(max-width: 600px) {
    .formula-grid {
        grid-template-columns: 1fr;
    }

    .hero h1 {
        font-size: 25px;
    }
}
</style>
</head>

<body>

<header>
    <h2>Study Vibe</h2>
    <a href="tools.html">← Back to Study Tools</a>
</header>

<main class="container">

    <div class="hero">
        <h1>Formula Book</h1>
        <p>Your collection of important Mathematics, Physics and Chemistry formulas.</p>
    </div>

    <div class="search-panel">
        <input
            type="text"
            id="searchInput"
            placeholder="Search a formula or topic..."
            oninput="renderFormulas()"
        >

        <div class="filters">
            <button class="active" onclick="filterSubject('All', this)">All</button>
            <button onclick="filterSubject('Mathematics', this)">Mathematics</button>
            <button onclick="filterSubject('Algebra', this)">Algebra</button>
            <button onclick="filterSubject('Geometry', this)">Geometry</button>
            <button onclick="filterSubject('Trigonometry', this)">Trigonometry</button>
            <button onclick="filterSubject('Physics', this)">Physics</button>
            <button onclick="filterSubject('Chemistry', this)">Chemistry</button>
        </div>
    </div>

    <h2 class="section-title" id="resultTitle">All Formulas</h2>

    <div class="formula-grid" id="formulaGrid"></div>

    <div class="empty" id="emptyMessage">
        No formulas found. Try another search.
    </div>

</main>

<footer>
    Study Vibe by Addrectionate
    <br><br>
    From Confusion to Confidence
</footer>

];

let selectedSubject = "All";

function filterSubject(subject, button) {
    selectedSubject = subject;

    document.querySelectorAll(".filters button").forEach(btn => {
        btn.classList.remove("active");
    });

    button.classList.add("active");
    renderFormulas();
}

function renderFormulas() {
    const search = document.getElementById("searchInput")
        .value.trim().toLowerCase();

    const grid = document.getElementById("formulaGrid");
    const empty = document.getElementById("emptyMessage");

    grid.replaceChildren();

    const filtered = formulas.filter(item => {
        const matchesSubject =
            selectedSubject === "All" ||
            item.subject === selectedSubject;

        const matchesSearch =
            item.title.toLowerCase().includes(search) ||
            item.formula.toLowerCase().includes(search) ||
            item.description.toLowerCase().includes(search) ||
            item.subject.toLowerCase().includes(search);

        return matchesSubject && matchesSearch;
    });

    document.getElementById("resultTitle").textContent =
        selectedSubject === "All"
            ? "All Formulas (" + filtered.length + ")"
            : selectedSubject + " Formulas (" + filtered.length + ")";

    empty.style.display = filtered.length ? "none" : "block";

    filtered.forEach(item => {
        const card = document.createElement("div");
        card.className = "formula-card";

        const title = document.createElement("h3");
        title.textContent = item.title;

        const formula = document.createElement("div");
        formula.className = "formula";
        formula.textContent = item.formula;

        const description = document.createElement("p");
        description.className = "description";
        description.textContent = item.description;

        const copy = document.createElement("button");
        copy.className = "copy-btn";
        copy.textContent = "📋 Copy Formula";

        copy.addEventListener("click", async () => {
            try {
                await navigator.clipboard.writeText(item.formula);
                copy.textContent = "✓ Copied!";
            } catch {
                copy.textContent = "Copy unavailable";
            }

            setTimeout(() => {
                copy.textContent = "📋 Copy Formula";
            }, 1500);
        });

        card.appendChild(title);
        card.appendChild(formula);
        card.appendChild(description);
        card.appendChild(copy);

        grid.appendChild(card);
    });
}

renderFormulas();

</script>

</body>
</html>
