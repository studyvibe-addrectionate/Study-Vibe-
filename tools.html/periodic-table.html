<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Periodic Table | Study Vibe</title>
<style>
:root {
  --bg:#0b1220; --panel:#151f32; --text:#edf3ff;
  --muted:#9aabc5; --line:#293750; --accent:#72a7ff;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Arial,sans-serif;padding:20px;
}
header{text-align:center;margin-bottom:22px}
header h1{margin:5px;font-size:30px;color:#8db9ff}
header p{color:var(--muted);margin:8px}
.brand{font-size:13px;letter-spacing:2px;color:#b9c9e5}
.controls{
  max-width:900px;margin:18px auto;display:flex;
  gap:10px;flex-wrap:wrap;justify-content:center;
}
input,select{
  background:var(--panel);color:white;border:1px solid var(--line);
  padding:12px;border-radius:9px;font-size:15px;
}
input{width:min(100%,350px)}
select{max-width:100%}
.table-wrap{
  overflow-x:auto;padding:10px 2px 18px;
  max-width:1500px;margin:auto;
}
.table{
  display:grid;grid-template-columns:repeat(18,minmax(57px,1fr));
  gap:5px;min-width:1100px;
}
.element{
  min-height:76px;border:1px solid #ffffff30;border-radius:7px;
  padding:5px 3px;text-align:center;color:#101827;
  cursor:pointer;transition:.15s;position:relative;
}
.element:hover{transform:scale(1.08);z-index:2;outline:2px solid white}
.element .num{font-size:10px;display:block;text-align:left}
.element .symbol{font-size:21px;font-weight:bold;display:block}
.element .name{font-size:9px;display:block;overflow:hidden}
.element .mass{font-size:9px;display:block;margin-top:3px}
.placeholder{
  color:var(--muted);font-size:11px;text-align:center;
  padding:12px 2px;min-height:76px;
}
.series-title{
  grid-column:1/19;color:#b7c9e7;padding:12px 0 4px;
  font-size:13px;
}
.legend{
  display:flex;gap:8px;flex-wrap:wrap;justify-content:center;
  max-width:1100px;margin:15px auto;
}
.legend span{
  font-size:11px;padding:6px 9px;border-radius:6px;color:#101827;
}
.info{
  display:none;max-width:650px;margin:20px auto;background:var(--panel);
  border:1px solid var(--line);padding:20px;border-radius:14px;
}
.info h2{font-size:30px;margin:0 0 5px}
.info .big-symbol{font-size:55px;font-weight:bold}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}
.info-item{background:#0d1729;padding:12px;border-radius:8px}
.info-item small{color:var(--muted);display:block;margin-bottom:5px}
.close{
  float:right;background:#263957;color:white;border:0;
  padding:7px 12px;border-radius:7px;cursor:pointer
}
.note{text-align:center;color:var(--muted);font-size:12px;margin:20px}
@media(max-width:600px){
  body{padding:12px}
  header h1{font-size:24px}
  .info-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<header>
  <div class="brand">STUDY VIBE BY ADDRECTIONATE</div>
  <h1>Interactive Periodic Table</h1>
  <p>Explore all 118 chemical elements</p>
</header>

<div class="controls">
  <input id="search" placeholder="Search element, symbol or atomic number...">
  <select id="filter">
    <option value="all">All Categories</option>
  </select>
</div>

<div class="legend" id="legend"></div>
<div class="table-wrap">
  <div class="table" id="table"></div>
</div>

<div class="info" id="info">
  <button class="close" onclick="closeInfo()">Close</button>
  <div class="big-symbol" id="detailSymbol"></div>
  <h2 id="detailName"></h2>
  <div id="detailCategory"></div>
  <div class="info-grid" id="detailGrid"></div>
</div>

<p class="note">Study Vibe • Chemistry Learning Tool • 118 Elements</p>

const categories = {
 alkali:"Alkali metal",
 alkaline:"Alkaline earth metal",
 transition:"Transition metal",
 post:"Post-transition metal",
 metalloid:"Metalloid",
 nonmetal:"Reactive nonmetal",
 halogen:"Halogen",
 noble:"Noble gas",
 lanthanoid:"Lanthanide",
 actinoid:"Actinide"
};

const colors = {
 alkali:"#ffb4a2", alkaline:"#ffd6a5",
 transition:"#fdffb6", post:"#caffbf",
 metalloid:"#9bf6ff", nonmetal:"#a0c4ff",
 halogen:"#bdb2ff", noble:"#ffc6ff",
 lanthanoid:"#d8c4ff", actinoid:"#f4b6d2"
};

const table = document.getElementById("table");
const filter = document.getElementById("filter");
const search = document.getElementById("search");

Object.keys(categories).forEach(key=>{
 const option=document.createElement("option");
 option.value=key;
 option.textContent=categories[key];
 filter.appendChild(option);

 const tag=document.createElement("span");
 tag.textContent=categories[key];
 tag.style.background=colors[key];
 document.getElementById("legend").appendChild(tag);
});

function makeElement(e){
 const [num,symbol,name,mass,category,period,group]=e;
 const div=document.createElement("div");
 div.className="element";
 div.dataset.category=category;
 div.dataset.search=(num+" "+symbol+" "+name).toLowerCase();
 div.style.background=colors[category];
 div.style.gridColumn=group;
 div.style.gridRow=period;
 div.innerHTML=`
 <span class="num">${num}</span>
 <span class="symbol">${symbol}</span>
 <span class="name">${name}</span>
 <span class="mass">${mass}</span>`;
 div.onclick=()=>showInfo(e);
 return div;
}

function render(){
 table.innerHTML="";
 elements.forEach(e=>{
  const div=makeElement(e);
  table.appendChild(div);
 });
 const title1=document.createElement("div");
 title1.className="series-title";
 title1.textContent="Lanthanides (57–71) and Actinides (89–103) are displayed in separate rows below the main table.";
 title1.style.gridRow="8";
 title1.style.gridColumn="1/19";
 // Add explanatory label above the f-block rows.
 table.appendChild(title1);

 // Position the f-block elements in their own two rows.
 elements.filter(e=>e[5]>=8).forEach(e=>{
  const div=makeElement(e);
  div.style.gridRow=e[5];
  div.style.gridColumn=e[6];
  table.appendChild(div);
 });
 applyFilters();
}

function applyFilters(){
 const q=search.value.trim().toLowerCase();
 const cat=filter.value;
 document.querySelectorAll(".element").forEach(div=>{
  const matchesSearch=div.dataset.search.includes(q);
  const matchesCategory=cat==="all"||div.dataset.category===cat;
  div.style.display=matchesSearch&&matchesCategory?"block":"none";
 });
}

function showInfo(e){
 const [num,symbol,name,mass,category,period,group]=e;
 document.getElementById("info").style.display="block";
 document.getElementById("detailSymbol").textContent=symbol;
 document.getElementById("detailName").textContent=name;
 document.getElementById("detailCategory").textContent=categories[category];
 document.getElementById("detailCategory").style.color=colors[category];

 const details=[
 ["Atomic Number",num],
 ["Symbol",symbol],
 ["Atomic Mass",mass],
 ["Category",categories[category]],
 ["Period",period<=7?period:"Lanthanide / Actinide series"],
 ["Group",group<=18?group:"—"]
 ];
 document.getElementById("detailGrid").innerHTML=details.map(d=>
 `<div class="info-item"><small>${d[0]}</small><strong>${d[1]}</strong></div>`
 ).join("");
 document.getElementById("info").scrollIntoView({behavior:"smooth",block:"center"});
}

function closeInfo(){
 document.getElementById("info").style.display="none";
}

search.addEventListener("input",applyFilters);
filter.addEventListener("change",applyFilters);

render();

</html>
